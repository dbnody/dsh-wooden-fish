<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木鱼 · DSH 插件</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="dsh-wooden-fish" class="mmwf-root" aria-label="木鱼">
    <div class="mmwf-toast-layer" aria-live="polite"></div>
    <section class="mmwf-widget" aria-label="木鱼计数器">
      <button id="mmwf-drag-handle" class="mmwf-drag-handle" type="button" aria-label="拖动木鱼，双击复位" title="拖动移动，双击复位">
        <span aria-hidden="true">⠿</span>
      </button>
      <div class="mmwf-count">
        <div class="mmwf-count-row">
          <span class="mmwf-count-label">今日</span>
          <strong id="mmwf-today">0</strong>
        </div>
        <div class="mmwf-count-row is-total">
          <span class="mmwf-count-label">总计</span>
          <strong id="mmwf-count">0</strong>
        </div>
      </div>
      <button id="mmwf-fish" class="mmwf-fish" type="button" aria-label="敲木鱼，功德加一">
        <span class="mmwf-aura" aria-hidden="true"></span>
        <span class="mmwf-fish-base" aria-hidden="true"></span>
        <span class="mmwf-fish-body" aria-hidden="true">
          <span class="mmwf-hole"></span>
          <span class="mmwf-shine"></span>
          <span class="mmwf-ring mmwf-ring-one"></span>
          <span class="mmwf-ring mmwf-ring-two"></span>
        </span>
        <span class="mmwf-handle" aria-hidden="true"></span>
        <span class="mmwf-mallet" aria-hidden="true"></span>
      </button>
      <div class="mmwf-actions">
        <button id="mmwf-mute" class="mmwf-small-button" type="button" aria-pressed="false" title="静音">🔊</button>
        <button id="mmwf-reset" class="mmwf-small-button" type="button" title="清零今日与总计功德">清零</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
