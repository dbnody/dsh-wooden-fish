<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>妙妙木鱼 · DSH 插件</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="dsh-wooden-fish" class="mmwf-root" aria-label="妙妙木鱼">
    <div class="mmwf-toast-layer" aria-live="polite"></div>
    <section class="mmwf-widget" aria-label="木鱼计数器">
      <div class="mmwf-count" title="累计功德">
        <span class="mmwf-count-label">功德</span>
        <strong id="mmwf-count">0</strong>
      </div>
      <button id="mmwf-fish" class="mmwf-fish" type="button" aria-label="敲木鱼，功德加一">
        <span class="mmwf-fish-body" aria-hidden="true">
          <span class="mmwf-hole"></span>
          <span class="mmwf-ring mmwf-ring-one"></span>
          <span class="mmwf-ring mmwf-ring-two"></span>
        </span>
        <span class="mmwf-handle" aria-hidden="true"></span>
        <span class="mmwf-mallet" aria-hidden="true"></span>
      </button>
      <div class="mmwf-actions">
        <button id="mmwf-voice" class="mmwf-small-button" type="button" title="切换语音">语音：开</button>
        <button id="mmwf-reset" class="mmwf-small-button" type="button" title="清零累计功德">清零</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
